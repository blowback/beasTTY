last_updated: 2026-08-06  # E11-2 -> DONE. Code review (--fix) recorded in the story file at write time: 4 findings, all fixed, plus 2 limits carried to S11.3. All four sat in one place - what a tab owes a requester AFTER it has posted accepted, which is the only moment with no safety net because the accept deliberately clears the requester's single deadline. FIXED (1) readSelfStatus() consulted only the four injected checks, and the injected isBusy does not go true until the SLIDE pull has entered recv/send several awaits past the accept, so two peers (tabs B and C both dragging at tab A) landing in that window both passed every check and S11.3's provider would have put two pulls on one wire; outstanding.size > 0 is now OR'd in where the status is READ, deliberately not inside chooseRefusal(), which stays a pure function of the status object so the AC precedence order remains testable alone. (2) __resetForTests() emptied outstanding with no bye - the peer mid-wait had had its deadline cleared by the accept, so nothing could ever release it, and a two-tab spec resetting tab A would hang tab B until Playwright's 30s timeout, exactly the failure teardown exists to prevent; dispose() had this right, the reset path did not. (3) The nonce was deleted BEFORE the final post(), which swallows throws by design, so a structured-clone failure stranded the requester permanently with neither pagehide nor dispose able to reach it; post() now returns whether it succeeded and the debt clears only then. (4) REFUSAL_CODES was bolted onto window.__peerLink from main.js, so every spec re-wire replaced the object wholesale and dropped it silently - it now hangs off what wirePeerLink returns. CARRIED to S11.3: an expired reply deadline tells the responder nothing, so a merely-slow peer still runs a full pull on its beast and posts a result nobody awaits (ending it needs a cancel message, a fifth kind, beyond this story's closed vocabulary); and a nonce past the 120s TTL is dropped in total silence, so the requester says "the other tab has gone" about a tab that is plainly right there - the ignore rule is what the ACs specify, but the WORDS are wrong for that case and S11.3's copy needs a sentence for it. Suite after fixes: 768 passed / 1 skipped / 6 flaky, all green on retry = the same 775 cases as the implementation run; the six are the standing load-sensitive pool recorded in S11.1's review, not this diff. Next: S11.3 (the drag itself). Implementation as landed: new www/transport/peer-link.js - one BroadcastChannel, per-tab crypto.randomUUID() session id, lazily-pruned single-use nonce table, four injected self-checks, frozen refusal-code set, {name, blob} blob handover. Two-phase exchange: immediate accepted/refused under ONE non-chained deadline, then files with none (a peer answers in microseconds but fulfils over 19200 baud - observed 0 ms for a refusal vs 2 ms for a 10.8 KB payload), plus a best-effort bye on pagehide for the tab that dies after accepting. One wirePeerLink call in main.js (deps as lazy thunks; isBusy is the COMPOSITE predicate, not slide-recv is recv-only one - the trap this codebase has hit three times), one isBound() on the pull pane, serial.js comment corrected with every string byte-for-byte unchanged (a peer link can falsify the in-use claim but never confirm it, and the narrower message needs copy nobody has written). 24 new cases across two specs including the repo FIRST two-page Playwright harness; every "it is ignored" case paired with a positive control, and five mutations run to prove the key cases red. One draft test was caught passing for the wrong reason - CSP blocks new Function, and a throwing provider is itself a pull-failed case, so all five malformed-payload rows went green without ever building the payload they were named after. Suite: 773 passed / 1 skipped / 1 flaky (baseline 748/1/2 = 751 cases; 751 + 24 = 775 = 773+1+1); the flake is the documented shifting failure set in file-source.spec.js, reproduced on the unmodified tree. KNOWN LIMIT carried: a hard-killed tab posts no bye and the requester waits - not papered over with a poll (the shape S11.4 removed); S11.3 owns what the user is told about a stalled transfer.
