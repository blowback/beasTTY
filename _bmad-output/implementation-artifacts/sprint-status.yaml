last_updated: 2026-08-06  # E11-3 implemented (review): the drag itself — the last story of E11 and the only one a user can see. New www/input/peer-drop.js owns BOTH halves of the gesture and every user-facing string: the source half (one getPeerStamp thunk handed to selection.js's existing dragstart, stamping a versioned JSON payload of session id + freshly minted single-use nonce + the S9.2-parsed filenames under a lowercase custom type — and stamping NOTHING when the selection holds no valid 8.3 name, so no foreign tab ever lights a target for a drag it could not honour; plus the provideFiles provider S11.2 deliberately left unwired) and the destination half (four handlers on #terminal-wrapper as its THIRD independent owner, this beast's own refusals run BEFORE any request is posted, the new #peer-copy-modal driven by the existing Confirm file transfers pref, and new File([blob], name) at the boundary into sendFiles because processFiles duck-types .name and a bare Blob would silently land every file in the REJECTED rows). peer-link.js is byte-for-byte unchanged. THREE CORRECTIONS TO THE STORY, all material: (1) slide-chip.js's onStateChange does NOT fan out the chip lifecycle — since Plan 11-04 it has carried exactly one event kind, 'inline-action', emitted only on a bracketed-button click; its own header (:19) and slide.js:319's subscribing comment BOTH describe it as the lifecycle hook, so the story's §5(d) took the description for the behaviour and specified an event source that did not exist. The fan-out was filled in (one emitLifecycle() helper per transition; additive by construction because the single existing subscriber early-returns on any other kind) and is flagged as API growth the story did not sanction in those words. (2) The two event sources are NOT ordered: slide.js's exitRecvMode fires enterSummary SYNCHRONOUSLY (:880-890) while the file writes it is summarising are still chained through slide-recv's downloadDispatchTail behind a 250 ms SLIDE-19 gap each, so resolving on the session-end event alone would drop the final file of every multi-file pull — a 1500 ms tail grace fixes the ordering. (3) The pane cannot subscribe to the chip at wire time: wireSlideChip runs AFTER wirePullPane in the boot order (AD-12), so the thunk would hit a const in its temporal dead zone; the subscription is taken lazily on the first peer pull. TWO BACKSTOPS, both justified as §5(d) demands and both one-shot, armed off an event, never re-armed from their own body: the tail grace (an ordering fix, not a deadline — it only runs AFTER the transfer is already over) and a 30 s START deadline for AC-7's 'a wakeup that never came', which neither source covers (no file lands, and awaiting-wakeup is not terminal; in Compatibility mode wakeup-required the chip arms no timeout of its own) — scoped to the handshake and cleared by the first sign of life, so a real 19200-baud transfer of any length is never timed out, which is the whole of S11.4's lesson. A structural spec asserts no setInterval, exactly two setTimeout sites, and no setTimeout nested in a setTimeout callback. THE §3(e) DEFECT IS FIXED AND PROVEN: hasBoundFolder is now pullPane.isBound() && getPrefs()?.slideRecvToFolder !== false, with a two-tab spec driving the exact stalling state (folder bound, Settings toggle off) asserting the honest no-folder sentence AND that no pull started on A, plus a positive control that flipping the pref back on gets the request accepted. 43 new cases: 34 single-page (tests/input/peer-drop.spec.js) and 9 two-tab (tests/transport/peer-drag-two-tabs.spec.js) on S11.2's harness, driving REAL SLIDE sessions in both directions — a recv session on A for the pull and a send session on B for the handoff, both against the independently-implemented JS mock bot (E9 retro action #1). Suite 813 passed / 1 skipped / 4 flaky = 818 cases, against a baseline measured this session of 772/1/2 = 775 (the story recorded 768/1/6 — the same 775 total, a different split of the same standing pool); 775 + 43 = 818. The four flaky are cursor-blink, slide-collisions, slide-compatibility and slide-wakeup — none in this story's files, all 35 green in isolation at --retries=0, and the set differs run to run. NINE MUTATIONS RUN, all confirmed red — but TWO only after the spec was strengthened, both passing for the wrong reason: (a) the ~N read-back case used WOTBEAST.FTH, and file-source's own 8.3 truncation repairs WOTBEAST~1.FTH straight back to WOTBEAST.FTH, so handing over the DISK name still reached B under the right name — re-fixtured to WOT.FTH, whose ~1 suffix fits 8.3 unchanged and therefore survives to the device; (b) the hidden-mid-pull case stayed green with the landing counter broken, because the session-end backstop resolved the wait 1.5 s later and the read-back still found the file — the transfer worked for the wrong reason, so lastPeerPullReason is now exposed and the case asserts 'complete' (landings) rather than 'ended' (backstop); without that one assertion AC-7's central claim was untested. Two harness facts found the hard way and recorded in the specs: a stub directory handle carries functions so IndexedDB refuses it (DataCloneError), which would have left slide-recv writing to the Downloads tray while the spec claimed to test the folder (bound through slide-recv's own picker instead); and slide-recv holds window.__prefs.live while main.js reads getPrefs(), so setting only one leaves the two halves disagreeing. NOT DONE: AC-15's manual checkpoint needs two physical MicroBeasts and a human doing a native drag in Chrome Split View — the single-file drag, the multi-file drag and the end-to-end refusal are ALL unverified on hardware. Owner: Ant. BOTH CARRIED E11 CHECKPOINTS RE-CARRIED, NEITHER CLOSED: S11.4's clamp fix is still simulated not hardware-verified (owner Ant, same two-beast setup closes it alongside AC-15), and main.js:458 still hands wireChrome the recv-only isSlideActive so the pagehide CTRL_CAN teardown never fires for SEND sessions — deliberately not fixed here because chrome.js is on this story's explicit no-change list; it needs its own story or a fix commit before E11 ships, and it is the same recv-only-predicate trap AC-4 guards against seen from a third angle (both composite predicates this story adds get it right, with a spec asserting the composition root's own wiring names hasPendingSendSession, both modes, and the wire owner). Approximations recorded rather than papered over: {X} is slideProgramDrive (where SLIDE.COM lives, not a guaranteed destination drive); NO sentence invented for the 120 s nonce-expiry case, which still reports 'the other beast's tab has gone' about a tab that is right there (UX-DR7 forbids coining one); multi-file {NAME} uses the FIRST requested name; a command past the 126-char cap pulls what fits and hands back what landed; sendFiles resolving is not proof the bytes reached the Z80. Open questions 1-4 remain open for Ant. Also observed but NOT fixed (out of scope): slide-recv's downloadToFolder returns without throwing when it finds no handle, so assembleAndDownload fires onFileLanded even on the anchor-tray path — harmless here (the read-back finds nothing and the pull resolves pull-failed, the honest outcome) but the callback's name is a lie on that path. Next: code review (different LLM), then AC-15 + the two carried checkpoints before E11 ships.
