last_updated: 2026-08-06  # E11 RETROSPECTIVE DONE (epic-e11-retro-2026-08-06.md, written in plain English at Ant's request after the first draft used too much invented shorthand). E11 AND E10 BOTH CLOSED.
#
# THE BUG THAT WAS BLOCKING E11 IS FIXED (b9827ab). Closing a tab while SENDING a file told the MicroBeast nothing, so it sat waiting for a file that was never coming. Two halves, both wrong: the check that decides whether to act only knew about transfers coming FROM the MicroBeast, and the stop command was the receive-only one which would have done nothing anyway. Reported three separate times across three stories and carried forward each time. New test proven to fail without the fix; its comment says honestly that it does NOT prove the second half (reverting that alone leaves it passing, because the raw stop byte is enough once the fake MicroBeast replies).
#
# THEN, ON ANT'S GO-AHEAD, THREE FOLLOW-UPS (see the action_items entries for detail):
#   d9f9acf — ONE shared answer to "is a transfer running?", replacing four hand-written versions that had drifted apart. The misleading function was renamed so its name says "receive only" — the name WAS the trap. Two live bugs fell out: pasting during a send was accepted with every byte silently discarded (progress bar advancing over nothing), and the session log leaked the MicroBeast's replies during sends.
#   b71f648 — the leftover-code hunt found one real item, a live bug: paste speed never followed the connection speed, so pasting at 9600 baud pushed bytes at nearly twice the wire's capacity. Plus six comments corrected that described work as unfinished when it had shipped.
#
# E10 CLOSED: e10-2 -> done on Ant's confirmation it was implemented and reviewed. Its Code Review section is a RECORD THAT A REVIEW HAPPENED AND NOTHING MORE — the findings were never written down and there is no review commit to reconstruct them from. Treat E10's review coverage as unrecorded, not clean. E10 retrospective skipped by Ant's call.
#
# WHAT THE RETROSPECTIVE FOUND. (1) One function that answers a narrower question than its name suggests caught out seven callers since E9 — four in E11 alone. Now fixed at source. (2) Six tests were found passing for the wrong reason, every one caught by deliberately breaking the fix and checking the test then fails; that habit is the most valuable thing in the epic and is written down nowhere. (3) Both hardware checks Ant ran found defects no test could reach — one proved an error message had never once appeared for the case it was written for, the other proved the real browser drag works at all and caught the confirm box naming the wrong drive. (4) Comments that describe things never built cost S11.3 real work, because a story gets planned off the comment.
#
# ANT'S VERDICT ON THE FEATURE: "worked first time and is impressive in action."
#
# SUITE: 823 passed / 1 skipped / 1 flaky = 825 cases. Two full runs, zero failures. The standing pool of load-sensitive flaky tests remains — a different set each run, all green in isolation, present across four stories now. It has never yet hidden a real problem but it is the thing that would.
#
# STILL OPEN, ANT'S CALL: E9 #4 (write expected transfer speeds somewhere findable — the number exists but is buried in a test script) and E8 #3 (write down the lighter test-startup pattern). Next: light bugfixes. No E12 defined.
# Superseded 2026-08-06 (kept for the S11.3 detail): E11-3 -> DONE, and with it every story of E11 (the epic stays in-progress on one carried defect, below). The drag itself: select a filename in one beast's terminal, drop it on the other beast's, and the file crosses - the last story of the epic and the only one a user can see. Implementation fff7137, which also carries the code-review fixes because the tree was still uncommitted when the review ran. New www/input/peer-drop.js owns BOTH halves of the gesture and every user-facing string: the source half (one getPeerStamp thunk handed to selection.js's existing dragstart, stamping a versioned JSON payload of session id + single-use nonce + optional mint timestamp + the parsed filenames under a lowercase custom type, and stamping NOTHING when the selection holds no valid 8.3 name) and the destination half (four handlers on #terminal-wrapper as its THIRD independent owner, this beast's own refusals run BEFORE any request is posted, the new #peer-copy-modal on the existing confirm-transfers pref, and new File([blob], name) at the boundary into sendFiles because processFiles duck-types .name and a bare Blob lands every file in the REJECTED rows without throwing). peer-link.js byte-for-byte unchanged. AC-15 RUN ON HARDWARE by Ant and PASSED - two MicroBeasts in Chrome Split View: single-file drag, multi-file drag, two refusals end to end, source tab hidden mid-transfer. It found one defect the whole automated suite could not, the modal's To row reading A: while the receiving beast was on B: ({X} was slideProgramDrive - where SLIDE.COM lives, not where CP/M writes); Ant's call was to delete the drive letter rather than qualify it, and getDestDrive went with it. CODE REVIEW (--fix, different LLM): 7 findings, 6 fixed, 1 recorded. The two that mattered both sat in pullForPeer's wait and were invisible to the suite for the same reason - the specs run one pull at a time through a directory stub that enumerates in insertion order. FIXED (1) THE ONE THAT COULD CORRUPT FILES: the read-back paired arrived[i] from dirHandle.entries() (DIRECTORY order) with requested[i] (SLIDE COMMAND order), so a two-file drag of ZAP.COM ABC.TXT handed the peer a ZAP.COM containing ABC.TXT's bytes and vice versa, silently, both transfers reporting success; now paired by name (exact, else the BASE~N.EXT shape ensureUnique produces, via a helper mirroring slide-recv.js:588-593). The story's recorded "arrival order = command order" assumption was wrong on the read-back side; the multi-file two-tab pin held only because that fixture's names are alphabetical. (2) onChipLifecycle treated EVERY terminal chip state as end-of-session, but each summary/error/notice arms a 5s auto-hide that emits 'hidden' - so two drags inside 5s had the first transfer's auto-hide settle the SECOND pull's wait early and report pull-failed about a pull running perfectly; only 'hidden' is now conditioned on this pull's session having shown life, every other terminal state stays unconditional because those are emitted by the tab actually entering them (the first, broader version of the fix broke AC-7's never-wakes case and was narrowed until it passed for the right reason). (3) a tailTimer armed by a terminal event was never cancelled when the chip recovered to 'active'. (4) handleDrop checked destination connected/busy BEFORE the confirm modal and never again, and that dialog can sit open indefinitely - unplug the port or start a local send, click Copy, and a full 19200-baud pull comes back to a tab that cannot take it; both checks now re-run after the confirm, as pull-pane.js already does. (5) hasBoundFolder shipped as slideRecvToFolder !== false, which reads a missing or nulled pref as USABLE - reintroducing in the narrow case the same silent stall the widening was written to close; now !!getPrefs()?.slideRecvToFolder, matching the truthiness test slide-recv.js:521 applies. (6) in sentenceForRefusal a torn-down peerLinkRef leaves codes as {}, so every case is undefined, an undefined code matched the FIRST case, and the user was told "This beast isn't connected" about a check nobody ran. (7) __resetForTests left lastPeerPullReason standing, so the very assertion added to stop AC-7 passing for the wrong reason could itself pass on the previous spec's value. RECORDED NOT FIXED: slide-chip.js's enterNotice can clobber a live progress chip when a late pull-failed lands after this tab started its own transfer - fixing it needs a precedence rule between notices and live progress, a UX call outside the diff with the copy frozen by UX-DR7; owner Ant. Also reconfirmed and still out of scope: slide-recv's downloadToFolder returns without throwing when it finds no handle, so onFileLanded fires on the anchor-tray path - the outcome stays honest (pull-failed) but the callback's name is a lie there. Suite after fixes: 581 passed / 1 skipped on chromium and 237 passed on chromium-transport, two pre-existing unrelated flakes green on retry - the standing load-sensitive pool from S11.1's review, not this diff. E11 CHECKPOINTS: S11.4's clamp fix is now hardware-observed and CLOSED, with the limit stated - a 10-second hide exercises the basic clamp but not Chromium's coarser post-~5-minute backgrounding regime. ONE RE-CARRIED AND STILL OPEN, which is why epic-e11 is not done: main.js:458 still hands wireChrome the recv-only isSlideActive, so the pagehide CTRL_CAN teardown never fires for SEND sessions - and since S11.4 made pagehide the sole hide-time trigger, that is the only remaining protection and it has a hole. It is the same recv-only-predicate trap AC-4 guards against, seen from a third angle. chrome.js was on S11.3's explicit no-change list; it needs its own story in E12 or a fix commit before E11 ships. Next: that fix, then the E11 retrospective (optional).
